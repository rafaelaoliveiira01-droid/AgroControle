<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Defensivo - AgroControle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="pagina-edicao">
        <div class="cabecalho-edicao">
            <h1>Editar Defensivo</h1>
            <p>Altere os dados do defensivo e salve as alterações.</p>
        </div>

        <!-- Mensagens do sistema -->
        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% if mensagens %}
                {% for categoria, mensagem in mensagens %}
                    <div class="mensagem {{ categoria }}">
                        {{ mensagem }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Formulário de edição -->
        <form method="POST" class="formulario-edicao">

            <div class="campo">
                <label for="nome">Nome do defensivo:</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    value="{{ defensivo['nome'] }}"
                    required
                >
            </div>

            <div class="campo">
                <label for="categoria">Categoria:</label>
                <select id="categoria" name="categoria" required>
                    <option value="Herbicida"
                        {% if defensivo['categoria'] == 'Herbicida' %}selected{% endif %}>
                        Herbicida
                    </option>

                    <option value="Fungicida"
                        {% if defensivo['categoria'] == 'Fungicida' %}selected{% endif %}>
                        Fungicida
                    </option>

                    <option value="Inseticida"
                        {% if defensivo['categoria'] == 'Inseticida' %}selected{% endif %}>
                        Inseticida
                    </option>

                    <option value="Fertilizante"
                        {% if defensivo['categoria'] == 'Fertilizante' %}selected{% endif %}>
                        Fertilizante
                    </option>

                    <option value="Outro"
                        {% if defensivo['categoria'] == 'Outro' %}selected{% endif %}>
                        Outro
                    </option>
                </select>
            </div>

            <div class="campo">
                <label for="fabricante">Fabricante:</label>
                <input
                    type="text"
                    id="fabricante"
                    name="fabricante"
                    value="{{ defensivo['fabricante'] }}"
                    required
                >
            </div>

            <div class="campo">
                <label for="estoque">Quantidade em estoque:</label>
                <input
                    type="number"
                    id="estoque"
                    name="estoque"
                    min="0"
                    step="any"
                    value="{{ defensivo['estoque'] }}"
                    required
                >
            </div>

            <div class="campo">
                <label for="unidade">Unidade de medida:</label>
                <select id="unidade" name="unidade" required>
                    <option value="Litros (L)"
                        {% if defensivo['unidade'] == 'Litros (L)' %}selected{% endif %}>
                        Litros (L)
                    </option>

                    <option value="Quilogramas (kg)"
                        {% if defensivo['unidade'] == 'Quilogramas (kg)' %}selected{% endif %}>
                        Quilogramas (kg)
                    </option>

                    <option value="Gramas (g)"
                        {% if defensivo['unidade'] == 'Gramas (g)' %}selected{% endif %}>
                        Gramas (g)
                    </option>

                    <option value="Mililitros (mL)"
                        {% if defensivo['unidade'] == 'Mililitros (mL)' %}selected{% endif %}>
                        Mililitros (mL)
                    </option>
                </select>
            </div>

            <div class="campo">
                <label for="validade">Data de validade:</label>
                <input
                    type="date"
                    id="validade"
                    name="validade"
                    value="{{ defensivo['validade'] or '' }}"
                    required
                >
            </div>

            <div class="campo">
                <label for="carencia">Período de carência (dias):</label>
                <input
                    type="number"
                    id="carencia"
                    name="carencia"
                    min="0"
                    value="{{ defensivo['carencia'] }}"
                    required
                >
            </div>

            <div class="botoes-edicao">
                <a href="{{ url_for('estoque') }}" class="botao-voltar">
                    Voltar
                </a>

                <button type="submit" class="botao-salvar">
                    Salvar alterações
                </button>
            </div>

        </form>
    </div>

</body>
</html>
