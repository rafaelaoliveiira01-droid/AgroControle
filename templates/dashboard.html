<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - AgroControl</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="dashboard-container">

        <div class="dashboard-title">
            <h1>📊 Dashboard</h1>
            <p>Visão geral do AgroControl</p>
        </div>

        <div class="dashboard-cards">

            <div class="dashboard-card">
                <div class="icone">📦</div>
                <h2>{{ total_produtos }}</h2>
                <p>Defensivos</p>
            </div>

            <div class="dashboard-card">
                <div class="icone">🌱</div>
                <h2>{{ total_aplicacoes }}</h2>
                <p>Aplicações</p>
            </div>

            <div class="dashboard-card">
                <div class="icone">📦</div>
                <h2>{{ total_estoque }}</h2>
                <p>Quantidade em estoque</p>
            </div>

            <div class="dashboard-card">
                <div class="icone">⏳</div>
                <h2>{{ aplicacoes_carencia }}</h2>
                <p>Em período de carência</p>
            </div>

        </div>

    </div>

</body>

</html>
